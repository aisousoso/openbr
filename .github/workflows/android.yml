name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - "shared/**"
      - "maps/**"
      - "scripts/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg.example"
      - ".github/workflows/android.yml"

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.4.1 and export templates
        env:
          GODOT_VERSION: "4.4.1"
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          wget -q -O /tmp/godot.zip "${BASE_URL}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/godot"
          TEMPLATES_DIR="${DATA_DIR}/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${TEMPLATES_DIR}"

          wget -q -O /tmp/templates.tpz "${BASE_URL}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            mv /tmp/godot-templates/templates/* "${TEMPLATES_DIR}/"
          else
            mv /tmp/godot-templates/* "${TEMPLATES_DIR}/"
          fi

          echo "Installed templates:"
          ls -1 "${TEMPLATES_DIR}" | sed -n '1,20p'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK=${ANDROID_SDK}"

          SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi

          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --sdk_root="${ANDROID_SDK}" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "Android SDK packages installed."

      - name: Configure Godot Android settings
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          fi
          CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          SETTINGS_FILE="${CONFIG_DIR}/editor_settings-4.4.tres"
          mkdir -p "${CONFIG_DIR}"

          # Let Godot create a complete default editor settings file first.
          # It may return non-zero while importing, so do not fail the job here.
          timeout 180 godot --headless --editor --quit --path . >/tmp/godot-editor.log 2>&1 || true
          echo "--- Godot editor log (tail) ---"
          tail -n 30 /tmp/godot-editor.log || true

          if [ ! -f "${SETTINGS_FILE}" ]; then
            echo "Godot did not create editor settings; writing a minimal file."
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
            } > "${SETTINGS_FILE}"
          fi

          # Add or replace the Android SDK/JDK/keystore settings.
          SETTINGS_FILE="${SETTINGS_FILE}" \
          ANDROID_SDK="${ANDROID_SDK}" \
          JAVA_SDK="${JAVA_HOME}" \
          KEYSTORE="${HOME}/.android/debug.keystore" \
          python3 - <<'PY'
          import os

          path = os.environ["SETTINGS_FILE"]
          values = {
              "export/android/android_sdk_path": os.environ["ANDROID_SDK"],
              "export/android/java_sdk_path": os.environ["JAVA_SDK"],
              "export/android/debug_keystore": os.environ["KEYSTORE"],
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }

          with open(path, "r", encoding="utf-8") as f:
              lines = f.read().splitlines()

          seen = set()
          result = []
          for line in lines:
              key = line.split("=", 1)[0].strip()
              if key in values:
                  result.append(f'{key} = "{values[key]}"')
                  seen.add(key)
              else:
                  result.append(line)

          if "[resource]" not in result:
              result.append("")
              result.append("[resource]")

          for key, value in values.items():
              if key not in seen:
                  result.append(f'{key} = "{value}"')

          with open(path, "w", encoding="utf-8") as f:
              f.write("\n".join(result) + "\n")
          PY

          mkdir -p "${HOME}/.android"
          if [ ! -f "${HOME}/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Editor settings:"
          grep -E 'export/android' "${SETTINGS_FILE}"

      - name: Export debug APK
        run: |
          set -euo pipefail
          cp export_presets.cfg.example export_presets.cfg
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/OpenBR.apk
          ls -lh build/OpenBR.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "${ANDROID_SDK}/build-tools/34.0.0/apksigner" verify --verbose build/OpenBR.apk
          "${ANDROID_SDK}/build-tools/34.0.0/aapt" dump badging build/OpenBR.apk \
            | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-permission)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBR-android-debug
          path: build/OpenBR.apk
          if-no-files-found: error
          retention-days: 14
